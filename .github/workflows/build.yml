# Builds SortKeeper for Windows, macOS and Linux, then publishes a GitHub Release.
#
# Runs automatically when sortkeeper.py (or this file) changes on main, or when a v* tag
# is pushed. You can also start it by hand: Actions tab -> "Build SortKeeper" -> "Run workflow".
#
# The release tag comes from APP_VERSION in sortkeeper.py (e.g. 1.0.0 -> v1.0.0).
# To ship a new version, bump APP_VERSION and push.
#
# Release file names have no version number, so these links always point to the newest release:
#   https://github.com/jaisudhakar/sortkeeper/releases/latest/download/SortKeeper-windows.exe
#   https://github.com/jaisudhakar/sortkeeper/releases/latest/download/SortKeeper-macos.zip
#   https://github.com/jaisudhakar/sortkeeper/releases/latest/download/SortKeeper-linux-x64
name: Build SortKeeper

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - sortkeeper.py
      - .github/workflows/build.yml
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: build-sortkeeper
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            out: SortKeeper-windows.exe
          - os: macos-latest
            out: SortKeeper-macos.zip
          - os: ubuntu-22.04
            out: SortKeeper-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk-dev

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Check the source compiles
        run: python -m py_compile sortkeeper.py

      - name: Build
        run: pyinstaller --onefile --windowed --name SortKeeper sortkeeper.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp dist/SortKeeper.exe "${{ matrix.out }}"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/SortKeeper.app "${{ matrix.out }}"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: cp dist/SortKeeper "${{ matrix.out }}" && chmod +x "${{ matrix.out }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from sortkeeper.py
        id: ver
        run: |
          v=$(grep -m1 -oP '^APP_VERSION\s*=\s*"\K[^"]+' sortkeeper.py)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"

      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: List files
        run: ls -la files

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: SortKeeper ${{ steps.ver.outputs.version }}
          make_latest: true
          overwrite_files: true
          body: |
            Organize your Downloads folder in one click: sort files by type, catch duplicates, undo anytime. 100% local, no account.

            **Downloads**
            - Windows 10+: `SortKeeper-windows.exe`
            - macOS (Apple Silicon): `SortKeeper-macos.zip`
            - Ubuntu 22.04+ / Linux x64: `SortKeeper-linux-x64` (run `chmod +x` first)

            **macOS:** the app isn't signed with an Apple developer certificate. The first time, right-click SortKeeper, choose **Open**, then click **Open** again.

            Website: https://onemandeveloper.com/sortkeeper/
          files: files/*
