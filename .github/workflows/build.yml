# Builds SortKeeper for Windows, macOS and Linux.
#
# - Push a tag like v1.0.0  -> builds all three and publishes them as a GitHub Release.
# - Actions tab -> "Build SortKeeper" -> "Run workflow" -> builds only (files appear under Artifacts).
#
# Release file names have no version number, so these links always point to the newest release:
#   https://github.com/jaisudhakar/sortkeeper/releases/latest/download/SortKeeper-windows.exe
#   https://github.com/jaisudhakar/sortkeeper/releases/latest/download/SortKeeper-macos.zip
#   https://github.com/jaisudhakar/sortkeeper/releases/latest/download/SortKeeper-linux-x64
name: Build SortKeeper

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            out: SortKeeper-windows.exe
          - os: macos-latest
            out: SortKeeper-macos.zip
          - os: ubuntu-22.04
            out: SortKeeper-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk-dev

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Check the source compiles
        run: python -m py_compile sortkeeper.py

      - name: Build
        run: pyinstaller --onefile --windowed --name SortKeeper sortkeeper.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp dist/SortKeeper.exe "${{ matrix.out }}"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/SortKeeper.app "${{ matrix.out }}"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: cp dist/SortKeeper "${{ matrix.out }}" && chmod +x "${{ matrix.out }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.out }}
